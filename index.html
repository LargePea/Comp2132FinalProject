<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman by Ralph</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous" defer></script>
    <script defer type="module" src="./js/index.js"></script>
</head>
<body class="flex-column">
    <div id="header">
        <h2>Hangman</h2>
    </div>
    <div id="content">
        <div id="game" class="flex-column">
            <div class="background" id="main-background">
                <img class="barb-1 barb" src="./images/Barb.png">
                <img class="barb-2 barb" src="./images/Barb.png">
                <img class="barb-3 barb" src="./images/Barb.png">
                <img class="barb-4 barb" src="./images/Barb.png">
            </div>
            <div id="game-display">
                <div id="wrong-display">
                    <div class="background" id="wrong-background">
                        <img class="barb-1 barb" src="./images/Barb.png">
                        <img class="barb-2 barb" src="./images/Barb.png">
                        <img class="barb-3 barb" src="./images/Barb.png">
                        <img class="barb-4 barb" src="./images/Barb.png">
                    </div>
                    <h3>Wrong Letters</h3>
                    <div id="wrong-letters">
                    </div>
                </div>
                <div id="hangman-container">
                    <img class="hangman" src="./images/hangman_0.png">
                    <img class="hangman" src="./images/hangman_1.png">
                    <img class="hangman" src="./images/hangman_2.png">
                    <img class="hangman" src="./images/hangman_3.png">
                    <img class="hangman" src="./images/hangman_4.png">
                    <img class="hangman" src="./images/hangman_5.png">
                    <img class="hangman" src="./images/hangman_6.png">
                </div>
            </div>
            <div id="word-container">
                <h3></h3>
            </div>
            <div id="hint">
                <button>Show Hint</button>
                <h3 hidden>Definition could not be found. Sorry...</h3>
            </div>
            <div id="input" class="flex-column">
                <div>
                    <button value="q">Q</button><button value="w">W</button><button value="e">E</button><button value="r">R</button><button value="t">T</button>
                    <button value="y">Y</button><button value="u">U</button><button value="i">I</button><button value="o">O</button><button value="p">P</button>
                </div>
                <div>
                    <button value="a">A</button><button value="s">S</button><button value="d">D</button><button value="f">F</button><button value="g">G</button>
                    <button value="h">H</button><button value="j">J</button><button value="k">K</button><button value="l">L</button>
                </div>
                <div>
                    <button value="z">Z</button><button value="x">X</button><button value="c">C</button><button value="v">V</button>
                    <button value="b">B</button><button value="n">N</button><button value="m">M</button>
                </div>
            </div>
            <div id="loading-screen">
                <div>
                    <h3>Loading</h3>
                    <h3 id="loading-bar">.</h3>
                </div> 
            </div>
            <div id="gameover">
                <div>
                    <h3 id="win-text">You Won!!</h3>
                    <h3 id="lose-text">Game Over!!</h3>
                    <div>
                        <button id="restart">Play Again</button>
                    </div>
                </div>
            </div>
            <div id="error">
                <div>
                    <h3>An Error has occured:</h3>
                    <h3 id="error-message"></h3>
                </div>
            </div>
        </div>
    </div>
    <div id="footer">
        <p>Ralph Li</p>
        <p>2026&copy;</p>
    </div>
</body>
</html>
